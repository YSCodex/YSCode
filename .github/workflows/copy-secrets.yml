name: Copy secrets (temporary)
on: workflow_dispatch
jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      COPY_TOKEN: ${{ secrets.COPY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - run: pip install pynacl -q
      - run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from nacl import encoding, public
          R = "YSCodex/YSCode-backend"
          H = {"Authorization": "Bearer " + os.environ["COPY_TOKEN"], "Accept": "application/vnd.github+json"}
          def api(m, p, b=None):
              r = urllib.request.Request("https://api.github.com" + p, method=m, headers=H, data=json.dumps(b).encode() if b else None)
              return json.load(urllib.request.urlopen(r)) or {}
          k = api("GET", f"/repos/{R}/actions/secrets/public-key")
          box = public.SealedBox(public.PublicKey(k["key"].encode(), encoding.Base64Encoder()))
          for n in ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "ADMIN_TOKEN", "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID"]:
              v = os.environ.get(n, "")
              if not v:
                  print("missing:", n); continue
              enc = base64.b64encode(box.encrypt(v.encode())).decode()
              api("PUT", f"/repos/{R}/actions/secrets/{n}", {"encrypted_value": enc, "key_id": k["key_id"]})
              print("copied:", n)
          PY
